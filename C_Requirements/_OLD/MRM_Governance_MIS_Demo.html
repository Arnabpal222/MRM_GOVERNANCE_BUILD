<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body style="margin:0">
<title>MRM Governance MIS Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: governance console — sticky run bar, left flow rail with a live database ledger, stage canvas on the right. Dark-first. */
:root {
  color-scheme: dark;
  --bg: #0E1118; --surface: #151A24; --raised: #1B2130; --sunk: #10141C;
  --line: #262E3F; --line-2: #33405A;
  --text: #E4E8F1; --muted: #98A0B3; --faint: #636C82;
  --accent: #8C9EFF; --accent-ink: #0E1118; --accent-soft: rgba(140,158,255,.13);
  --good: #57B77F; --warn: #E3A94B; --bad: #EC6A57; --info: #6AAEEA;
  --good-soft: rgba(87,183,127,.14); --warn-soft: rgba(227,169,75,.15); --bad-soft: rgba(236,106,87,.15); --info-soft: rgba(106,174,234,.14);
  --c1: #7AA2F7; --c2: #B294F0; --c3: #4FC1A6; --c4: #E0A458; --c5: #E07A8A;
  --display: 'Archivo', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --body: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --r: 8px; --r-sm: 5px;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  color-scheme: light;
  --bg: #F3F4F7; --surface: #FFFFFF; --raised: #F6F7FA; --sunk: #ECEEF3;
  --line: #DDE1EA; --line-2: #C6CCDA;
  --text: #161A24; --muted: #555E73; --faint: #8A92A5;
  --accent: #3B53D4; --accent-ink: #FFFFFF; --accent-soft: rgba(59,83,212,.09);
  --good: #23874E; --warn: #A86A0C; --bad: #C23C2A; --info: #2A72B8;
  --good-soft: rgba(35,135,78,.10); --warn-soft: rgba(168,106,12,.11); --bad-soft: rgba(194,60,42,.10); --info-soft: rgba(42,114,184,.10);
  --c1: #2F68D0; --c2: #7652CC; --c3: #13826B; --c4: #AE6A0E; --c5: #BC3F5C;
} }
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #F3F4F7; --surface: #FFFFFF; --raised: #F6F7FA; --sunk: #ECEEF3;
  --line: #DDE1EA; --line-2: #C6CCDA;
  --text: #161A24; --muted: #555E73; --faint: #8A92A5;
  --accent: #3B53D4; --accent-ink: #FFFFFF; --accent-soft: rgba(59,83,212,.09);
  --good: #23874E; --warn: #A86A0C; --bad: #C23C2A; --info: #2A72B8;
  --good-soft: rgba(35,135,78,.10); --warn-soft: rgba(168,106,12,.11); --bad-soft: rgba(194,60,42,.10); --info-soft: rgba(42,114,184,.10);
  --c1: #2F68D0; --c2: #7652CC; --c3: #13826B; --c4: #AE6A0E; --c5: #BC3F5C;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { font: 14px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }

/* Top run bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar-in { display: flex; align-items: center; gap: 16px; padding: 10px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-family: var(--display); font-stretch: 88%; font-weight: 750; font-size: 17px; letter-spacing: .01em; white-space: nowrap; }
.brand span { font-size: 12px; color: var(--faint); white-space: nowrap; }
.now { flex: 1; min-width: 180px; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.now em { font-style: normal; color: var(--text); font-weight: 500; }
.controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.icon { width: 32px; padding: 0; justify-content: center; }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-sm); overflow: hidden; height: 32px; }
.seg button { border: 0; background: transparent; padding: 0 10px; cursor: pointer; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); }
.progress { height: 2px; background: var(--line); }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }

/* Main layout */
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - 56px); }
.layout > * { min-width: 0; }
.rail { border-right: 1px solid var(--line); background: var(--sunk); padding-block: 18px; padding-inline: 16px; display: flex; flex-direction: column; gap: 22px; }
.rail h3 { margin: 0 0 8px; font: 600 11px/1 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.step { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; width: 100%; text-align: left; padding: 8px 8px; border: 0; border-radius: var(--r-sm); background: transparent; cursor: pointer; }
.step:hover { background: var(--raised); }
.step .dot { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; font: 500 11px var(--mono); color: var(--faint); margin-top: 1px; }
.step.done .dot { border-color: var(--good); color: var(--good); }
.step.cur { background: var(--accent-soft); }
.step.cur .dot { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.step .t { font-size: 13px; font-weight: 500; line-height: 1.3; }
.step .s { font-size: 11px; color: var(--faint); margin-top: 2px; display: flex; gap: 4px; flex-wrap: wrap; }
.step.cur .t { color: var(--text); }
.tpl { font: 500 10.5px/1 var(--mono); padding: 3px 5px; border-radius: 3px; background: var(--raised); border: 1px solid var(--line); color: var(--muted); }
.step.cur .tpl { border-color: var(--accent); color: var(--text); }
.group-label { font: 600 10.5px/1 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--faint); padding: 12px 8px 4px; }
.ledger { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 12px; }
.ledger .k { font-family: var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.ledger .v { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
.ledger .v.zero { color: var(--faint); }
.ledger .v.flash { color: var(--accent); }
.ledger .tot { border-top: 1px solid var(--line); padding-top: 5px; margin-top: 3px; }
.rail-note { font-size: 11.5px; color: var(--faint); line-height: 1.45; }

.stage { padding-block: 20px 60px; padding-inline: 28px; min-width: 0; }
.flowbar { display: flex; align-items: stretch; gap: 0; margin-bottom: 22px; overflow-x: auto; padding-bottom: 2px; }
.fnode { flex: 1 1 0; min-width: 118px; border: 1px solid var(--line); background: var(--surface); padding: 8px 10px; border-radius: var(--r-sm); transition: border-color .3s, background .3s; }
.fnode .l { font: 600 10.5px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.fnode .v { font-size: 12.5px; margin-top: 5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fnode.on { border-color: var(--accent); background: var(--accent-soft); }
.fnode.on .v { color: var(--text); }
.farrow { flex: 0 0 22px; display: grid; place-items: center; color: var(--faint); }
.farrow.on { color: var(--accent); }
.farrow svg { width: 14px; height: 14px; fill: currentColor; }

/* Stage content */
.eyebrow { font: 600 11px/1 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--accent); }
.stage h1 { font-family: var(--display); font-stretch: 86%; font-weight: 750; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.12; margin: 8px 0 8px; text-wrap: balance; letter-spacing: -.005em; }
.lede { color: var(--muted); max-width: 70ch; margin: 0 0 20px; font-size: 14.5px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.cols > * { min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.panel h4 { margin: 0 0 10px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.panel h4 small { font-weight: 400; color: var(--faint); font-size: 11.5px; }
.stack { display: flex; flex-direction: column; gap: 16px; }

.file { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.file .glyph { width: 30px; height: 36px; border-radius: 3px; border: 1px solid var(--line-2); position: relative; background: var(--raised); display: grid; place-items: end center; padding-bottom: 4px; font: 600 8px var(--mono); color: var(--muted); }
.file .glyph::before { content: ""; position: absolute; top: -1px; right: -1px; width: 9px; height: 9px; background: var(--bg); border-left: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); }
.file .glyph.xlsx { color: var(--good); } .file .glyph.csv { color: var(--info); } .file .glyph.pdf { color: var(--bad); } .file .glyph.docx { color: var(--c1); }
.file .fn { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.file .meta { font-size: 11.5px; color: var(--faint); margin-top: 2px; }
.file .bar { grid-column: 2 / 4; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.file .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s linear; }
.file .state { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.file .state.ok { color: var(--good); }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.tablewrap.scroll { max-height: 340px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font: 600 10.5px/1.2 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 9px 10px; border-bottom: 1px solid var(--line); background: var(--raised); position: sticky; top: 0; z-index: 1; white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.mono, td .mono { font-size: 12px; white-space: nowrap; }
tr.rej td { background: var(--bad-soft); }
tr.new td { animation: rowin .35s ease both; }
@keyframes rowin { from { opacity: .2; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--accent-soft); }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; line-height: 18px; white-space: nowrap; border: 1px solid transparent; }
.p-good { background: var(--good-soft); color: var(--good); }
.p-warn { background: var(--warn-soft); color: var(--warn); }
.p-bad { background: var(--bad-soft); color: var(--bad); }
.p-info { background: var(--info-soft); color: var(--info); }
.p-acc { background: var(--accent-soft); color: var(--accent); }
.p-mute { background: var(--raised); color: var(--muted); border-color: var(--line); }
.sev { display: inline-block; width: 3px; align-self: stretch; border-radius: 2px; }

.tally { display: flex; gap: 10px; flex-wrap: wrap; }
.tally .t { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 12px; min-width: 96px; background: var(--surface); }
.tally .t b { display: block; font: 600 20px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.tally .t span { font-size: 11.5px; color: var(--muted); }
.tally .t.bad b { color: var(--bad); } .tally .t.warn b { color: var(--warn); } .tally .t.good b { color: var(--good); } .tally .t.acc b { color: var(--accent); }
.note { font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--line-2); padding: 2px 0 2px 12px; margin: 0; max-width: 72ch; }
.note b { color: var(--text); font-weight: 600; }
.errline { font: 12px/1.45 var(--mono); color: var(--bad); background: var(--bad-soft); border-radius: var(--r-sm); padding: 8px 10px; overflow-wrap: anywhere; }

/* Overview diagram */
.ov { display: grid; gap: 10px; }
.ov-row { display: grid; gap: 10px; }
.ov-ch { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.ov-proc { grid-template-columns: 3fr 1fr; }
.ov-out { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ovb { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 12px; min-width: 0; }
.ovb .n { font-weight: 600; font-size: 13px; }
.ovb .st { font-size: 11px; color: var(--faint); margin: 1px 0 6px; }
.ovb ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.ovb li { font-size: 12px; display: flex; gap: 6px; align-items: baseline; }
.ovb li .tpl { flex: none; }
.ovb.db { background: var(--accent-soft); border-color: var(--accent); text-align: center; }
.ovb.center { text-align: center; }
.ovb .sub { font-size: 12px; color: var(--muted); }
.ov-arrow { display: flex; justify-content: space-around; color: var(--faint); height: 14px; }
.ov-arrow svg { width: 14px; height: 14px; fill: currentColor; }

/* Extraction cards */
.cand { display: grid; grid-template-columns: 3px 1fr auto; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); align-items: start; transition: opacity .3s, border-color .3s; }
.cand .ttl { font-weight: 600; font-size: 13px; }
.cand .ds { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.cand .acts { display: flex; gap: 6px; align-items: center; }
.cand.ok { border-color: var(--good); }
.cand.drop { opacity: .45; }
.cand .mini { height: 26px; padding: 0 9px; font-size: 12px; }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.checklist li { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 5px 8px; border-radius: var(--r-sm); }
.checklist li .mk { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; border: 1px solid var(--line-2); color: var(--faint); flex: none; }
.checklist li.ok .mk { border-color: var(--good); color: var(--good); }
.checklist li.miss { background: var(--bad-soft); }
.checklist li.miss .mk { border-color: var(--bad); color: var(--bad); }
.thinking { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

/* Rules engine */
.rules { display: grid; gap: 8px; }
.rule { display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1.4fr); gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.rule .id { font: 600 12px var(--mono); color: var(--accent); }
.rule .nm { font-size: 13px; font-weight: 500; }
.rule .nm small { display: block; color: var(--faint); font-weight: 400; font-size: 11.5px; }
.rule .out { font-size: 12.5px; color: var(--muted); }
.rule .out b { color: var(--text); font-weight: 600; }
.rule .pbar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 6px; }
.rule .pbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .5s ease; }
.rule.done .pbar i { background: var(--good); }
.cta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 18px; padding: 14px 16px; border: 1px dashed var(--accent); border-radius: var(--r); background: var(--accent-soft); }
.cta p { margin: 0; flex: 1; min-width: 220px; font-size: 13px; color: var(--muted); }
.cta .btn { height: 38px; padding: 0 18px; font-size: 14px; }
.cta .btn.go { animation: glow 1.2s ease-in-out infinite; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft); } 50% { box-shadow: 0 0 0 6px var(--accent-soft); } }

/* Dashboard */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 10px 14px; cursor: pointer; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.kpi .l { font: 600 10.5px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.kpi .v { font: 600 28px/1.1 var(--mono); font-variant-numeric: tabular-nums; margin-top: 6px; letter-spacing: -.02em; }
.kpi .s { font-size: 12px; margin-top: 3px; }
.kpi .d { font-size: 11px; color: var(--faint); margin-top: 6px; line-height: 1.4; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; margin-bottom: 12px; }
.grid3 > *, .grid2 > * { min-width: 0; }
.cap { font-size: 11.5px; color: var(--faint); margin: -6px 0 10px; }
.donutwrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.donut { width: 118px; height: 118px; flex: none; }
.legend { display: grid; gap: 6px; flex: 1; min-width: 140px; }
.legend .row { display: grid; grid-template-columns: 10px 1fr auto auto; gap: 8px; align-items: center; font-size: 12.5px; }
.legend .sw { width: 10px; height: 10px; border-radius: 2px; }
.legend .ct { font-family: var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.legend .pc { font: 600 13px var(--mono); font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }
.bars { display: grid; gap: 7px; }
.brow { display: grid; grid-template-columns: minmax(90px, 128px) 1fr 44px; gap: 10px; align-items: center; font-size: 12.5px; }
.brow .nm { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow .tr { height: 12px; background: var(--raised); border-radius: 2px; overflow: hidden; display: flex; }
.brow .tr i { display: block; height: 100%; }
.brow .vl { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.pipe { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; align-items: end; height: 150px; }
.pipe .c { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end; height: 100%; min-width: 0; }
.pipe .c .b { background: var(--accent); opacity: .75; border-radius: 3px 3px 0 0; min-height: 3px; }
.pipe .c.rv .b { background: var(--warn); opacity: 1; }
.pipe .c .n { font: 600 12px var(--mono); text-align: center; margin-bottom: 3px; }
.pipe-l { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
.pipe-l span { font-size: 10.5px; color: var(--faint); text-align: center; line-height: 1.2; overflow-wrap: anywhere; }
.insights { display: grid; gap: 6px; }
.ins { display: grid; grid-template-columns: 3px 1fr; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); font-size: 12.5px; }
.ins .m { color: var(--faint); font-size: 11px; margin-top: 2px; }

function countsBefore(i) {

async function goTo(i, opts = {}) {

}

/* ---------- Charts ---------- */
function donut(segs) {
  const total = segs.reduce((s, x) => s + x.v, 0); let off = 0; const r = 42, C = 2 * Math.PI * r;
  const arcs = segs.map(s => { const len = C * s.v / total; const a = `<circle cx="59" cy="59" r="${r}" fill="none" style="stroke:${s.c}" stroke-width="18" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 59 59)"/>`; off += len; return a; }).join('');
  return `<svg class="donut" viewBox="0 0 118 118" role="img" aria-label="${segs.map(s => s.l + ' ' + s.v).join(', ')}">${arcs}<text x="59" y="57" text-anchor="middle" style="fill:var(--text);font:600 18px var(--mono)">${total}</text><text x="59" y="73" text-anchor="middle" style="fill:var(--faint);font:10px var(--body)">models</text></svg>`;
}
function legend(segs) { const t = segs.reduce((s, x) => s + x.v, 0); return `<div class="legend">${segs.map(s => `<div class="row"><span class="sw" style="background:${s.c}"></span><span>${s.l}</span><span class="ct">${s.v}</span><span class="pc">${pct(s.v, t)}%</span></div>`).join('')}</div>`; }
function revalTimeline() {
  const W = 560, H = 170, x0 = 40, x1 = W - 16, lo = -60, hi = 60; const X = d => x0 + (Math.max(lo, Math.min(hi, d)) - lo) / (hi - lo) * (x1 - x0);
  const bins = {}; let dots = '';
  REVAL.forEach(m => { const d = daysToDue(m); const b = Math.round(d / 5) * 5; bins[b] = (bins[b] || 0) + 1; const y = 128 - (bins[b] - 1) * 13; const st = revalStatus(m); const c = st === 'Overdue' ? 'var(--bad)' : st === 'Due soon' ? 'var(--warn)' : 'var(--info)'; dots += `<circle cx="${X(b)}" cy="${y}" r="5.5" style="fill:${c}"><title>${m.id} ${esc(m.name)} · ${d < 0 ? -d + ' days overdue' : 'due in ' + d + ' days'}</title></circle>`; });
  const ticks = [-60, -30, 0, 30, 60].map(t => `<line class="gridl" x1="${X(t)}" x2="${X(t)}" y1="20" y2="138"/><text class="axt" x="${X(t)}" y="154" text-anchor="middle">${t > 0 ? '+' + t : t}</text>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Days to revalidation for ${REVAL.length} models"><rect x="${x0}" y="20" width="${X(0) - x0}" height="118" style="fill:var(--bad-soft)"/>${ticks}<line class="ax" x1="${x0}" x2="${x1}" y1="138" y2="138"/><text class="axl" x="${x0 + 4}" y="34">Overdue</text><text class="axl" x="${X(30) + 4}" y="34">Lead-time window</text>${dots}<text class="axt" x="${x1}" y="${H - 2}" text-anchor="end">days to due date</text></svg></div>`;
}
function rocChart(m) {
  const pts = CURVES.filter(p => p.model === m.id && p.curve === 'ROC'); if (!pts.length) return '';
  const W = 300, H = 220, p = 34, X = v => p + v * (W - p - 10), Y = v => H - p - v * (H - p - 10);
  const path = pts.map((q, i) => `${i ? 'L' : 'M'}${X(q.x).toFixed(1)} ${Y(q.y).toFixed(1)}`).join(' ');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ROC curve, AUC ${pts[0].auc}">${[0, .5, 1].map(t => `<line class="gridl" x1="${X(t)}" x2="${X(t)}" y1="${Y(1)}" y2="${Y(0)}"/><line class="gridl" x1="${X(0)}" x2="${X(1)}" y1="${Y(t)}" y2="${Y(t)}"/><text class="axt" x="${X(t)}" y="${H - 18}" text-anchor="middle">${t}</text><text class="axt" x="${p - 6}" y="${Y(t) + 3}" text-anchor="end">${t}</text>`).join('')}<line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}" style="stroke:var(--faint)" stroke-dasharray="4 4"/><path d="${path} L${X(1)} ${Y(0)} L${X(0)} ${Y(0)} Z" style="fill:var(--accent-soft)"/><path d="${path}" fill="none" style="stroke:var(--accent)" stroke-width="2"/><text class="axl" x="${X(.55)}" y="${Y(.3)}">AUC ${pts[0].auc}</text><text class="axt" x="${W / 2}" y="${H - 3}" text-anchor="middle">false positive rate</text></svg></div>`;
}
function pvaChart(m) {
  const pr = CURVES.filter(p => p.model === m.id && p.series === 'predicted'), ac = CURVES.filter(p => p.model === m.id && p.series === 'actual'); if (!pr.length) return '';
  const all = [...pr, ...ac].map(p => p.y), lo = Math.min(...all) * 0.97, hi = Math.max(...all) * 1.03;
  const W = 320, H = 200, p = 40, X = i => p + i * (W - p - 12) / (pr.length - 1), Y = v => H - 30 - (v - lo) / (hi - lo) * (H - 50);
  const line = (arr, c, dash) => `<path d="${arr.map((q, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(q.y).toFixed(1)}`).join(' ')}" fill="none" style="stroke:${c}" stroke-width="2" ${dash ? 'stroke-dasharray="5 4"' : ''}/>`;
  const f = v => v < 5 ? v.toFixed(2) : Math.round(v);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Predicted versus actual">${[lo, (lo + hi) / 2, hi].map(v => `<line class="gridl" x1="${p}" x2="${W - 12}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axt" x="${p - 6}" y="${Y(v) + 3}" text-anchor="end">${f(v)}</text>`).join('')}${pr.map((q, i) => i % 2 ? '' : `<text class="axt" x="${X(i)}" y="${H - 12}" text-anchor="middle">${q.x.slice(2)}</text>`).join('')}${line(pr, 'var(--accent)', true)}${line(ac, 'var(--warn)')}<text class="axl" x="${p + 4}" y="14" style="fill:var(--accent)">Predicted</text><text class="axl" x="${p + 76}" y="14" style="fill:var(--warn)">Actual</text></svg></div>`;
}
function ring(v) { const r = 26, C = 2 * Math.PI * r; const c = v >= 80 ? 'var(--good)' : v >= 60 ? 'var(--warn)' : 'var(--bad)'; return `<svg viewBox="0 0 64 64" role="img" aria-label="Governance score ${v}"><circle cx="32" cy="32" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="6"/><circle cx="32" cy="32" r="${r}" fill="none" style="stroke:${c}" stroke-width="6" stroke-dasharray="${C * v / 100} ${C}" transform="rotate(-90 32 32)" stroke-linecap="round"/><text x="32" y="37" text-anchor="middle" style="fill:var(--text);font:600 16px var(--mono)">${v}</text></svg>`; }
const idl = id => `<button class="idlink" data-m="${id}">${id}</button>`;
